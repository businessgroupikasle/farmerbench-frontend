server {
    listen 80;
    server_name localhost;

    # Do not advertise the Nginx version
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # ---------------------------------------------------------------------
    # Security headers (enforced)
    # ---------------------------------------------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;
    # Only honoured by browsers over HTTPS; terminate TLS in front of this server.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-Security-Policy in REPORT-ONLY mode: violations are reported in the browser
    # console without blocking anything, so Google Sign-In, Google Translate, Razorpay
    # Checkout and analytics keep working. After verifying there are no unexpected
    # violations, rename the header to "Content-Security-Policy" to enforce it.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-OwEPXapO6tikpifjWmzYoa67FzLIw5PFsYweMMfBHok=' https://accounts.google.com https://apis.google.com https://checkout.razorpay.com https://translate.google.com https://translate.googleapis.com https://www.gstatic.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://translate.googleapis.com https://www.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://accounts.google.com https://api.razorpay.com https://checkout.razorpay.com https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://translate.google.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https://api.razorpay.com; frame-ancestors 'none'" always;

    # Never serve dotfiles (.env, .git, etc.) or common backup/source-map artefacts
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
    location ~* \.(env|git|bak|backup|old|orig|sql|log|map)$ {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";
}
